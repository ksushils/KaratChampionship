name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: karat
          POSTGRES_PASSWORD: karat
          POSTGRES_DB: karat
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U karat" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://karat:karat@localhost:5432/karat
      TEST_DATABASE_URL: postgres://karat:karat@localhost:5432/karat_test
      PAYLOAD_SECRET: ci-secret-not-for-production
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      APP_ENV: development
      PAYLOAD_DB_PUSH: 'true'
      EMAIL_ADAPTER: log
      ENQUIRY_RATE_LIMIT: '200'
      NEXT_PUBLIC_ANALYTICS_SRC: https://analytics.example.test/script.js
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: PGPASSWORD=karat psql -h localhost -U karat -c "CREATE DATABASE karat_test;" karat
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:int
      - run: pnpm audit --prod --audit-level=high || true
      - run: pnpm seed:demo
      - run: pnpm build
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: 'true' }
      - run: (pnpm start &) && npx wait-on http://localhost:3000 && pnpm check:links
